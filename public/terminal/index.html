<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/terminal.css" />
    <script src="script.js" defer></script>
</head>

<body>
    <div id="wrapper">
        <header>
            <div id="fetch">
                Bem vindo. Digite "help" para ajuda.
            </div>
        </header>

        <main>
            <div id="history"></div>
            <div id="wrapperInput">
                <div>
                     <span>></span> <!-- caret -->
                </div>
               
                <div id="userInputDiv">
                    <input type="text" id="userInput" autocomplete="off" spellcheck="false">
                    <span id="caret">_</span>
                </div>
            </div>

            <div id="answerDiv">
            </div>

            <div id="extraSpace"></div>
        </main>
    </div>
</body>

</html>
